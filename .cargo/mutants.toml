# Configuration for `cargo mutants` (see .github/workflows/ci.yml's
# `mutation-test` job, and https://github.com/travisboettcher/hl-lang/issues/29).
#
# Every exclusion here must be a deliberate, justified call, not a
# default — see issue #29.

exclude_globs = [
    # `main()` is a one-line wrapper (`run(Cli::parse())`) with no
    # branching or logic of its own — everything it calls (`Cli::parse`,
    # `hl_cli::run`) is already covered by hl-cli's own unit/integration
    # tests. It can't be meaningfully exercised by `cargo test` at all:
    # it's the process entry point, never called by test code, so no
    # test could ever observe a mutated `main` returning a different
    # `ExitCode` without actually spawning the built binary as a
    # subprocess — a level of test infrastructure disproportionate to
    # a function with zero logic to protect.
    "crates/hl-cli/src/main.rs",
]

# These specific mutants are confirmed, by design, to make the mutated
# function loop forever on realistic input (see the termination-invariant
# doc comments on `Lexer::bump`/`Lexer::skip_trivia` in
# crates/hl-lexer/src/lexer.rs and `Parser::parse_statement_into` in
# crates/hl-parser/src/parser.rs for exactly which invariant each one
# breaks and why). `cargo mutants` already reports each as TIMEOUT rather
# than caught/missed — proof the test suite does detect the bad
# behavior — but a TIMEOUT mutant still makes the whole `cargo mutants`
# invocation exit non-zero (distinct from a "missed" mutant, and from
# plain test failures), which would make this CI job flaky/slow to fail
# on unrelated changes without ever pointing at real, fixable missing
# coverage. Excluding them here is a deliberate, per-site call, not a
# default: each match is scoped to the exact mutation (by its exact
# generated description, not merely "this whole function") so any other,
# different mutant later added to these same functions still runs
# normally.
exclude_re = [
    # Lexer::bump -> Option<(usize, char)> replaced wholesale (None, or
    # a fixed Some(..)): none of these ever call self.chars.next(), so
    # self.chars never advances and skip_trivia's/next_token's own loops
    # spin forever re-observing the same character.
    "replace Lexer<'src>::bump -> Option<\\(usize, char\\)> with",
    # skip_trivia's `c == '\n'` comment-terminator check flipped to
    # `!=`: breaks on the *first* comment character (`'#'` itself, since
    # `'#' != '\n'`) before it's ever bumped, so the outer `loop` re-peeks
    # the same unconsumed `'#'` and repeats forever on any `#` comment.
    "replace == with != in Lexer<'src>::skip_trivia",
    # parse_statement_into replaced wholesale with `Ok(())`: consumes no
    # tokens, so parse_struct_body's `while self.peek().kind !=
    # TokenKind::RBrace` loop condition never changes and spins forever
    # on any non-empty struct body.
    "replace Parser<'src>::parse_statement_into -> Result<\\(\\), ParseError> with Ok\\(\\(\\)\\)",
]
