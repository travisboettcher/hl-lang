name: Fuzz (nightly)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Read-only: this workflow only builds and fuzzes, and an explicit
# block keeps a change to the repo default from widening that.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-deep:
    name: deep fuzz run (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 10 minutes of fuzzing per target plus toolchain/cargo-fuzz build;
    # without a cap a fuzz run that wedges would sit at GitHub's six-hour
    # default every night.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lex, fuzz_parse, fuzz_pipeline]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Restore corpus cache
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Seed corpus from test fixtures
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp crates/hl-lexer/tests/fixtures/*.hll fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cp crates/hl-parser/tests/fixtures/*.hll fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: cargo fuzz run (10 min)
        # See ci.yml's fuzz-smoke job for why --target is pinned here.
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=600

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
