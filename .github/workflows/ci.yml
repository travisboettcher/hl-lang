name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing in this workflow writes to the
# repository, and an explicit block means a change to the org/repo
# default can't silently widen what CI can do.
permissions:
  contents: read

# Superseded PR runs are cancelled — a push that obsoletes an in-flight
# run makes its result irrelevant. Runs on `main` are deliberately *not*
# cancelled: main's CI history is the record of which commits were
# actually green, and a cancelled run leaves a hole in it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-latest
    # Every job sets a timeout: the GitHub default is six hours, and
    # `.cargo/mutants.toml` documents mutants that hang rather than
    # fail, so an unbounded job can burn a whole day of runner minutes
    # before anyone notices.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo test (coverage gate, >= 80% lines)
        run: cargo llvm-cov --workspace --html --fail-under-lines 80

      # cargo-llvm-cov excludes doctests by default, so the doctests in
      # the crates' own rustdoc would otherwise never run in CI at all.
      - name: cargo test --doc
        run: cargo test --workspace --doc

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: ignore

  build:
    name: build (release)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Upload hllc binary
        uses: actions/upload-artifact@v7
        with:
          name: hllc-linux-x86_64
          path: target/release/hllc
          if-no-files-found: error

  mutation-test:
    name: mutation testing (cargo-mutants)
    runs-on: ubuntu-latest
    # The most generous budget here: cargo-mutants runs the whole test
    # suite once per mutant.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: cargo mutants
        run: cargo mutants --workspace --timeout-multiplier 3 --output mutants.out

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: mutants.out
          if-no-files-found: ignore

  fuzz-smoke:
    name: fuzz smoke test (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 60s of fuzzing plus a nightly toolchain and cargo-fuzz build.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lex, fuzz_parse, fuzz_pipeline]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed corpus from test fixtures
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp crates/hl-lexer/tests/fixtures/*.hll fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cp crates/hl-parser/tests/fixtures/*.hll fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: cargo fuzz run (60s)
        # cargo-fuzz defaults to x86_64-unknown-linux-musl on Linux, which
        # this runner doesn't have installed and which conflicts with
        # ASan's sanitizer (static musl libc isn't sanitizer-compatible:
        # "sanitizer is incompatible with statically linked libc").
        # Target the host's own gnu triple instead, sidestepping both.
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
