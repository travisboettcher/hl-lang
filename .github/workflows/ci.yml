name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each candidate on top of `main`'s real tip
  # plus every entry ahead of it, which is the state the merge actually
  # produces — and the state a plain `pull_request` run never sees. A
  # PR's run reflects the base as it was when the run started, so two
  # PRs developed in parallel can each be green against a `main` that
  # lacks the other's change and still break it on the second merge.
  # That is exactly how v0.33.0 shipped red (#244): #234 added a
  # `check.trycmd` fixture spelling a field #235 was concurrently
  # renaming. Neither PR was wrong; nothing ran the combination until
  # it was already on `main`.
  merge_group:

# Read-only by default: nothing in this workflow writes to the
# repository, and an explicit block means a change to the org/repo
# default can't silently widen what CI can do.
permissions:
  contents: read

# Superseded PR runs are cancelled — a push that obsoletes an in-flight
# run makes its result irrelevant. Runs on `main` are deliberately *not*
# cancelled: main's CI history is the record of which commits were
# actually green, and a cancelled run leaves a hole in it.
#
# Merge-queue runs are not cancelled either, and need no separate case
# here: `github.ref` for a `merge_group` event is that entry's own
# `refs/heads/gh-readonly-queue/main/pr-N-<sha>`, unique per candidate,
# so no two queue runs ever share a group. Cancelling one would be
# actively wrong — the queue is waiting on that result to decide
# whether the candidate merges, and a cancelled run reads as a failure
# that evicts the PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `insta`'s inline snapshots in crates/hl-codegen/tests/golden_tests.rs
  # are the expected Compose YAML, so a mismatch is a real failure and
  # has to be reviewed by a person. `no` forbids insta from writing
  # anything: it neither rewrites a snapshot in place nor leaves a
  # `.pending-snap` file behind, so the only outcome CI can reach is a
  # failed assertion with a diff. insta already infers this from the
  # `CI` variable GitHub sets, but that inference is a default the
  # library could change, and the cost of stating it is one line
  # against a silently self-approving test suite.
  INSTA_UPDATE: "no"
  # The same standing rule for `trycmd`'s transcripts in
  # crates/hl-cli/tests/cmd/: the `.trycmd` file and its `.out/`
  # directory are the expected output of the `hllc` binary, so a
  # mismatch has to be read by a person rather than blessed by the
  # machine that produced it. `trycmd` only writes when TRYCMD is
  # literally `overwrite` (or `dump`) and fails on a mismatch
  # otherwise, so this is already its default — stating it means a
  # `TRYCMD` leaking in from a runner image or a repository variable
  # can't quietly turn CI into a rubber stamp. Any value that isn't
  # `overwrite`/`dump` selects the failing mode; `fail` is the name
  # `trycmd` uses for it internally.
  TRYCMD: "fail"
  # `snapbox` is what compares the `.out/` directories, and it reads
  # its own action out of SNAPSHOTS. `verify` is its default and its
  # name for "fail on mismatch"; `overwrite` is the one to keep out.
  # The same pin covers the regression corpus in
  # crates/hl-cli/tests/cases/, which deliberately reuses this variable
  # rather than introducing a third one: a `.expected` file there is the
  # compiler's expected output, so CI must fail on a mismatch rather
  # than rewrite the file it just disagreed with.
  SNAPSHOTS: "verify"

jobs:
  test:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-latest
    # Every job sets a timeout: the GitHub default is six hours, and
    # `.cargo/mutants.toml` documents mutants that hang rather than
    # fail, so an unbounded job can burn a whole day of runner minutes
    # before anyone notices.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy, llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      # `--all-features` is what reaches hl-cli's off-by-default
      # `docker-differential` feature, whose test code nothing else in
      # this job compiles. Linting needs no Docker — the test only
      # shells out to it at run time — so the gated code stays honest
      # here, in the required check, instead of rotting until someone
      # enables the feature.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: cargo test (coverage gate, >= 80% lines)
        run: cargo llvm-cov --workspace --html --fail-under-lines 80

      # cargo-llvm-cov excludes doctests by default, so the doctests in
      # the crates' own rustdoc would otherwise never run in CI at all.
      - name: cargo test --doc
        run: cargo test --workspace --doc

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/llvm-cov/html
          if-no-files-found: ignore

  compose-differential:
    name: differential test (docker compose config)
    runs-on: ubuntu-latest
    # Two `docker compose config` invocations per document over a corpus
    # of roughly fifteen, each a client-side parse with no image pull and
    # no container start, so the budget here is a Rust build plus a few
    # seconds. The cap exists for the same reason every other job's does.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      # `ubuntu-latest` ships both the Docker CLI and the Compose v2
      # plugin, so there is nothing to install. Printing the version
      # anyway records which Compose actually graded this run: the
      # oracle is external, so its version is part of the result, and a
      # rejection that appears out of nowhere is usually a Compose
      # upgrade rather than a codegen change.
      - name: docker compose version
        run: docker compose version

      # Deliberately its own job rather than another step in `test`.
      # That job is the coverage gate every pull request has to clear,
      # and this one depends on a tool outside the Rust toolchain
      # entirely — a Compose upgrade that rejects something new, or a
      # runner image without the plugin, would otherwise block changes
      # that have nothing to do with generated YAML. Splitting them
      # keeps the failure legible: a red `test` is the code, a red
      # `compose-differential` is the output contract.
      - name: cargo test (docker-differential)
        run: cargo test -p hl-cli --features docker-differential --test compose_differential

  build:
    name: build (release)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Upload hllc binary
        uses: actions/upload-artifact@v7
        with:
          name: hllc-linux-x86_64
          path: target/release/hllc
          if-no-files-found: error

  mutation-test:
    name: mutation testing (cargo-mutants)
    runs-on: ubuntu-latest
    # The most generous budget here: cargo-mutants runs the whole test
    # suite once per mutant.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: cargo mutants
        run: cargo mutants --workspace --timeout-multiplier 3 --output mutants.out

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: mutants.out
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pinned dev/CI toolchain (rust-toolchain.toml) is newer than
      # the declared floor on purpose — this job is what actually keeps
      # that floor honest rather than aspirational. rust-toolchain.toml
      # would otherwise silently override the toolchain this job just
      # installed (it takes precedence over `rustup default`), so
      # RUSTUP_TOOLCHAIN forces the MSRV one for real.
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace --all-targets
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"
        run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny (advisories, licenses, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # deny.toml's [advisories] section deliberately ignores nothing —
      # see its own comment and #76/#126 for why (the serde_yaml
      # question those issues describe is settled: #126 migrated to the
      # maintained serde_yaml_ng fork, and an empty ignore list means
      # any future RustSec filing surfaces here automatically).
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check

  prose-lint:
    name: prose lint (vale, Google style)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `reporter: local` keeps this job read-only, matching the
      # `contents: read` default above — `github-pr-check`, the
      # action's own default reporter, needs `checks`/`pull-requests`
      # write access to annotate the PR. `fail_level: any` fails on
      # any alert, not just errors: the baseline this repo maintains
      # is zero Vale findings of any severity. `filter_mode: nofilter`
      # gates the whole tree rather than just diff-added lines — the
      # default `added` needs a git-diff reviewdog doesn't have under
      # `reporter: local` and errors out ("diff command is empty").
      # `vale sync` (the action's default) fetches the Google style
      # package at run time — it isn't vendored, see .gitignore.
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: 3.17.1
          reporter: local
          filter_mode: nofilter
          fail_level: any

  fuzz-smoke:
    name: fuzz smoke test (${{ matrix.target }})
    runs-on: ubuntu-latest
    # 60s of fuzzing plus a nightly toolchain and cargo-fuzz build.
    timeout-minutes: 30
    # rust-toolchain.toml pins a stable release for the rest of CI, but
    # it takes precedence over `rustup default nightly` too (a toolchain
    # file beats the default toolchain), which would otherwise silently
    # hand cargo-fuzz's `-Z` flags to a stable rustc that rejects them.
    env:
      RUSTUP_TOOLCHAIN: nightly
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_lex, fuzz_parse, fuzz_pipeline]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Seed corpus from test fixtures
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp crates/hl-lexer/tests/fixtures/*.hll fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true
          cp crates/hl-parser/tests/fixtures/*.hll fuzz/corpus/${{ matrix.target }}/ 2>/dev/null || true

      - name: cargo fuzz run (60s)
        # cargo-fuzz defaults to x86_64-unknown-linux-musl on Linux, which
        # this runner doesn't have installed and which conflicts with
        # ASan's sanitizer (static musl libc isn't sanitizer-compatible:
        # "sanitizer is incompatible with statically linked libc").
        # Target the host's own gnu triple instead, sidestepping both.
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
