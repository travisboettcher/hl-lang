name: Semver label

# Every merge to main automatically cuts a release (release.yml), and the
# size of the version bump is read off whichever `semver-major`/
# `semver-minor`/`semver-patch` label is on the merged PR — there's no
# commit-message convention to fall back on. This is the enforcement
# side: block any PR into main that doesn't carry exactly one of those
# three labels, so release.yml never finds itself trying to release a PR
# with no bump size to apply. Mark this job as a required status check
# in the repo's branch protection settings for main.
#
# It also mirrors release.yml's 0.x -> 1.0.0 gate: while the version is
# still 0.x, `semver-major` needs an accompanying `release-1.0` label,
# since it would otherwise cut 1.0.0 off a routine label. Catching that
# here means it shows up on the PR rather than as a failed release job
# after merge; release.yml enforces it again for real.

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  check-semver-label:
    name: require exactly one semver-* label
    # release.yml's own "chore(release): vX [release-bump]" PR never
    # carries a semver-* label (it only reads one off the *original* PR
    # to compute the bump) — without this exemption, making this job a
    # required status check would leave that auto-generated PR forever
    # failing it, and its `gh pr merge --auto` would never fire. It's
    # opened via a RELEASE_PLZ_TOKEN PAT owned by the repo owner (see
    # release.yml's own comment on why it's not GITHUB_TOKEN), so the
    # author check is against `repository_owner`, not `github-actions
    # [bot]`. The author + title-marker check together mean an external
    # contributor can't spoof this by naming their own PR the same way.
    #
    # PRECONDITION (#79): falling back to `repository_owner` is only
    # correct while this repo lives under a personal account whose login
    # is also the account that owns RELEASE_PLZ_TOKEN. Transfer it to an
    # organisation and `repository_owner` becomes the org name, which
    # matches no PR author — the `[release-bump]` PR would start failing
    # this required check, `gh pr merge --auto` would never fire, and
    # releases would stop, several layers removed from the symptom. Set
    # the `RELEASE_BOT_LOGIN` repository variable (Settings -> Secrets
    # and variables -> Actions -> Variables) to the login of whoever
    # owns RELEASE_PLZ_TOKEN and this keeps working; unset, it behaves
    # exactly as before. linked-issue.yml carries the same fallback and
    # reads the same variable.
    #
    # Dependabot's `github-actions` PRs are exempt too (#96): they change
    # CI configuration only and can't affect the shipped binary, so
    # releasing for one would publish a new version with byte-identical
    # contents. Left unlabelled, release.yml's own "no semver-* label
    # found" path skips the release for that merge, which is the wanted
    # outcome. Its `cargo` PRs are deliberately *not* exempt — those do
    # change the binary, dependabot.yml labels them `semver-patch`, and
    # keeping them gated here means that if that labelling ever silently
    # stops working, this check catches it instead of a binary-affecting
    # change merging with no release. The ecosystem is read off the
    # branch name, which Dependabot always prefixes
    # `dependabot/<ecosystem>/` — grouped runs included, since those only
    # change what follows the prefix (`.../actions-<hash>` rather than
    # `.../actions/checkout-7`). `user.login` is set by GitHub and can't
    # be spoofed by a contributor branch named to look the same way.
    if: |
      !(github.event.pull_request.user.login == (vars.RELEASE_BOT_LOGIN || github.repository_owner) &&
        contains(github.event.pull_request.title, '[release-bump]')) &&
      !(github.event.pull_request.user.login == 'dependabot[bot]' &&
        startsWith(github.head_ref, 'dependabot/github_actions/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check labels
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          count=$(jq '[.[] | select(.name | startswith("semver-"))] | length' <<<"$LABELS_JSON")
          if [ "$count" -ne 1 ]; then
            echo "::error::This PR must carry exactly one of semver-major, semver-minor, or semver-patch (found $count) — release.yml uses it to compute the version bump when this PR merges to main."
            exit 1
          fi
          name=$(jq -r '[.[] | select(.name | startswith("semver-"))][0].name' <<<"$LABELS_JSON")
          echo "OK: $name"

          # Pre-merge mirror of release.yml's 0.x -> 1.0.0 gate, so the
          # mistake surfaces on the PR instead of as a failed release job
          # after merge. release.yml still enforces it independently —
          # labels can change between this check and the merge, and only
          # that job sees the version as of the merge commit.
          has_release_1_0=$(jq '[.[] | select(.name == "release-1.0")] | length' <<<"$LABELS_JSON")
          current=$(grep -m1 '^version' crates/hl-cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          major=${current%%.*}

          if [ "$name" = "semver-major" ] && [ "$major" -eq 0 ] && [ "$has_release_1_0" -eq 0 ]; then
            echo "::error::\`semver-major\` on $current would cut 1.0.0 when this merges, freezing the .hll language and hllc CLI contract. If that's intended, add the \`release-1.0\` label too; if not, use \`semver-minor\` (the 0.x convention for a breaking change). See CONTRIBUTING.md, 'Crossing to 1.0'."
            exit 1
          fi

          if [ "$has_release_1_0" -ne 0 ] && [ "$name" != "semver-major" ]; then
            echo "::error::The \`release-1.0\` label only means anything alongside \`semver-major\` — it is the override for the 0.x -> 1.0.0 bump, and does nothing on a \`$name\` PR. Remove it, or switch to \`semver-major\` if 1.0.0 is what this PR should cut."
            exit 1
          fi

          if [ "$has_release_1_0" -ne 0 ]; then
            echo "OK: release-1.0 present — merging this PR will cut 1.0.0 from $current."
          fi
