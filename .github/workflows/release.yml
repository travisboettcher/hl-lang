name: Release

# Every merge to main is a release: no separate manual tag push. The
# `open-version-bump-pr` job reads the `semver-major`/`semver-minor`/
# `semver-patch` label off the PR that just merged (enforced present by
# semver-label.yml), computes the next version from it, writes that
# version into every crate's Cargo.toml via `release-plz set-version`,
# and opens+auto-merges a small bot PR with that change. Its merge is
# itself a push to main, which re-triggers this workflow — that second
# run is recognized by the `[release-bump]` marker in the squash commit
# message and runs `publish-release` instead: `release-plz release` tags
# and creates the GitHub Release as a draft, then the actual `hllc`
# binary is built, attached, and the release published.
# It has to stay a draft until the binary's attached — GitHub's
# immutable-releases feature locks a published release's assets
# immediately, so uploading to it afterward fails.
#
# One bump is gated rather than computed: 0.x -> 1.0.0. `semver-major`
# on a 0.x version would otherwise ship 1.0.0 off a routine label, so
# `open-version-bump-pr` refuses it unless the merged PR also carries a
# `release-1.0` label. semver-label.yml runs the same check pre-merge so
# the mistake is usually caught on the PR; this one is the backstop, and
# the only one that sees the real version at merge time.
#
# The version bump lands via a real PR merge rather than a direct push
# to main so this keeps working under branch protection that requires
# PRs/status checks — it just never needs a human to click merge.
#
# ## Why there is no `concurrency:` block (#79)
#
# This workflow only triggers on pushes to main, so `github.ref` is
# always `refs/heads/main` and every run would land in the same
# concurrency group. GitHub keeps at most one *pending* run per group:
# merge three PRs in quick succession and the middle run is cancelled
# outright — no bump PR, no release, and no failure to notice. Worse, a
# bump PR's own merge push shares that group too, so a queued
# `publish-release` could be cancelled after the version bump had
# already merged, leaving main's manifests at a version with no tag and
# no release. Runs are therefore left to overlap, and made safe to:
#
#   * The version to release is `max(newest v* tag, main's manifest, the
#     open bump PR's version)` rather than main's manifest alone, which
#     lags a release behind until the bump PR merges. The tag is the
#     authoritative record of what actually shipped; taking the max on
#     top of it means overlapping runs never compute the same number and
#     never lose a larger bump to a smaller one.
#   * Every run shares one `release/version-bump` branch, re-cut from
#     that run's own commit and force-pushed under `--force-with-lease`,
#     so at most one bump PR is ever open. Two open bump PRs would both
#     edit the same `version =` line from the same base and neither
#     would auto-merge. A run that loses the lease race re-reads the
#     branch and retries, so it can only ever raise the pending version.
#   * A squash merge applies the bump PR's diff to main as of the merge,
#     so whichever run wins the race, the release cut from that merge
#     contains every commit merged before it. Nothing is dropped; rapid
#     merges collapse into one shared release instead.
#
# `workflow_dispatch` runs `publish-release` on demand. That is the
# manual repair for the one state nothing re-triggers on its own: a bump
# PR merged but its publish run never finished, so main's manifests sit
# ahead of the newest tag. `open-version-bump-pr` emits a warning
# whenever it sees that state.
#
# `open-version-bump-pr` authenticates as a `RELEASE_PLZ_TOKEN` PAT
# (fine-grained, this repo only, Contents + Pull requests: read/write)
# instead of the default GITHUB_TOKEN: GitHub blocks the default token
# from both creating PRs (unless "Allow GitHub Actions to create and
# approve pull requests" is on) and from letting that PR's own checks
# run without a maintainer's manual approval — a guardrail against a
# workflow opening a PR, passing its own CI, and self-merging unwatched.
# A PAT is attributed to a real account, so the PR it opens behaves like
# any other PR. `publish-release` doesn't create PRs, so it stays on
# GITHUB_TOKEN. Which account that is matters to semver-label.yml and
# linked-issue.yml, which exempt the bump PR from their required checks
# by author — see the precondition recorded in those files.

on:
  push:
    branches: [main]
  # Republish on demand: see "Why there is no concurrency block" above.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write

jobs:
  open-version-bump-pr:
    name: open version-bump PR
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[release-bump]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One shared branch, deliberately not named after the version it
      # carries: it is re-pointed at a higher version rather than joined
      # by a second branch when merges overlap. See the header comment.
      BUMP_BRANCH: release/version-bump
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history *and tags* — the version to release is derived
          # from the newest `v*` tag, not just from main's manifest.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Find the semver label on the merged PR
        id: label
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")
          pr_number=$(jq -r '.[0].number // empty' <<<"$pr_json")
          labels=$(jq -r '.[0].labels[]?.name // empty' <<<"$pr_json")
          bump=""
          if grep -qx "semver-major" <<<"$labels"; then bump=major
          elif grep -qx "semver-minor" <<<"$labels"; then bump=minor
          elif grep -qx "semver-patch" <<<"$labels"; then bump=patch
          fi
          # The opt-in override for the one bump that can't be undone:
          # 0.x -> 1.0.0. Read here alongside the semver-* labels so the
          # next step has it; enforced there, where the current version
          # is known. See "Crossing to 1.0" in CONTRIBUTING.md.
          if grep -qx "release-1.0" <<<"$labels"; then
            echo "release_1_0=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_1_0=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$bump" ]; then
            echo "No semver-major/minor/patch label found on PR #${pr_number:-?} (or no associated PR) — skipping release for this merge."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "bump=$bump" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.label.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2
        if: steps.label.outputs.skip == 'false'

      - name: Install release-plz
        if: steps.label.outputs.skip == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Compute next version, bump every crate, push the bump branch
        if: steps.label.outputs.skip == 'false'
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          BUMP: ${{ steps.label.outputs.bump }}
          RELEASE_1_0: ${{ steps.label.outputs.release_1_0 }}
          SOURCE_PR: ${{ steps.label.outputs.pr_number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `fetch-depth: 0` already brings the tags along, but the version
          # this job computes is derived from them — so fetch them here in
          # their own right rather than as a side effect of a checkout
          # option that could be tuned later without anyone connecting it
          # to "the release came out one version too low".
          git fetch --tags --force --quiet origin
          # Absent until the first bump branch is ever pushed, and absent
          # again whenever the repo auto-deletes the head branch after the
          # bump PR merges — both are normal, so the "couldn't find remote
          # ref" that fetch prints for them is not worth logging.
          git fetch --force --quiet origin \
            "+refs/heads/$BUMP_BRANCH:refs/remotes/origin/$BUMP_BRANCH" 2>/dev/null || true

          read_version() {
            grep -m1 '^version' "$1" | sed -E 's/version = "(.*)"/\1/'
          }

          base_sha=$(git rev-parse HEAD)
          git checkout -B "$BUMP_BRANCH" --quiet

          pushed=false
          for attempt in 1 2 3; do
            git reset --hard --quiet "$base_sha"

            # What actually shipped. release-plz tags hl-cli as `vX.Y.Z`
            # (release-plz.toml's git_tag_name) and the other four crates
            # as `<crate>-vX.Y.Z`, so the bare-v pattern selects exactly
            # the releases. Empty before the first release ever.
            tag_version=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
            # What main claims. Equal to tag_version in steady state, one
            # release ahead in the window between a bump PR merging and
            # its publish run tagging.
            main_version=$(read_version crates/hl-cli/Cargo.toml)
            # What an already-open bump PR is about to release. Read off
            # the branch rather than the PR title so it can't drift.
            pending_version=""
            pending_pr=$(gh pr list --state open --head "$BUMP_BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$pending_pr" ] && git rev-parse --verify --quiet "refs/remotes/origin/$BUMP_BRANCH" >/dev/null; then
              git show "refs/remotes/origin/$BUMP_BRANCH:crates/hl-cli/Cargo.toml" > "$RUNNER_TEMP/pending-cargo.toml"
              pending_version=$(read_version "$RUNNER_TEMP/pending-cargo.toml")
            fi

            # The next version has to clear all three: the last release,
            # whatever main already claims, and whatever the open bump PR
            # is about to claim. Taking the max is what keeps overlapping
            # runs from computing the same number or from force-pushing a
            # smaller bump over a larger one.
            current=$(printf '%s\n%s\n%s\n' "$tag_version" "$main_version" "$pending_version" \
              | grep -v '^$' | sort -V | tail -n1)
            echo "last tag: ${tag_version:-<none>} | main: $main_version | open bump PR: ${pending_version:-<none>} -> bumping from $current"

            if [ -n "$tag_version" ] && [ "$main_version" != "$tag_version" ]; then
              echo "::warning::main is at $main_version but the newest tag is v$tag_version. Either a publish run for v$main_version is still in flight (it will catch up on its own), or it never finished — in which case run this workflow manually (Actions -> Release -> Run workflow) to tag and publish v$main_version. This run is unaffected: it bumps from $current, so it cannot collide with it."
            fi

            IFS='.' read -r major minor patch <<<"$current"
            # Declaring 1.0 is a decision, not an arithmetic consequence of
            # a label. Without this gate, a routine `semver-major` on 0.2.2
            # ships 1.0.0 — freezing the .hll language and the hllc CLI (see
            # the README's "What a version number promises") with nothing
            # between the label and the announcement. Require an explicit
            # `release-1.0` label alongside `semver-major` for that one
            # transition; every other bump, 0.x or 1.x+, is unaffected.
            if [ "$BUMP" = "major" ] && [ "$major" -eq 0 ] && [ "$RELEASE_1_0" != "true" ]; then
              echo "Refusing to bump $current -> 1.0.0."
              echo
              echo "PR #$SOURCE_PR carries \`semver-major\` while the current version is"
              echo "still 0.x, so this merge would cut the first 1.0.0 release. 1.0 is a"
              echo "commitment to a frozen .hll language and hllc CLI contract, so it needs"
              echo "to be deliberate rather than a side effect of a label."
              echo
              echo "If 1.0 was intended: add the \`release-1.0\` label to PR #$SOURCE_PR and re-run"
              echo "this workflow (Actions -> this run -> Re-run failed jobs)."
              echo
              echo "If it was not: the change is breaking but should stay in 0.x — relabel"
              echo "PR #$SOURCE_PR \`semver-minor\` (the 0.x convention for a breaking change)"
              echo "and re-run this workflow."
              echo "::error::Refusing to bump $current -> 1.0.0: PR #$SOURCE_PR has \`semver-major\` but not \`release-1.0\`. Add \`release-1.0\` and re-run to cut 1.0.0, or relabel \`semver-minor\` to stay in 0.x. See CONTRIBUTING.md, 'Crossing to 1.0'."
              exit 1
            fi
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"

            release-plz set-version \
              "hl-lexer@$next" "hl-parser@$next" "hl-codegen@$next" \
              "hl-linker@$next" "hl-cli@$next"
            # Refreshes Cargo.lock's own copy of each bumped crate's version
            # (cargo rewrites it for any local path package on any build/check
            # invocation) so it doesn't drift from Cargo.toml.
            cargo check --workspace --quiet

            # Explicit paths, not `git add -A`: the only files this commit
            # should ever carry are the five manifests release-plz just
            # rewrote plus the lockfile cargo refreshed. `-A` would sweep in
            # anything else those two left in the tree.
            git add crates/*/Cargo.toml Cargo.lock
            git commit --quiet -m "chore(release): v$next [release-bump]"

            # An empty expected value means "this ref must not exist yet",
            # which is the first-ever-bump case. Anything else means the
            # branch has to still be where the reads above saw it.
            expected=$(git rev-parse --verify --quiet "refs/remotes/origin/$BUMP_BRANCH" || true)
            if git push --force-with-lease="refs/heads/$BUMP_BRANCH:$expected" \
                 origin "HEAD:refs/heads/$BUMP_BRANCH"; then
              pushed=true
              break
            fi

            # Another run re-pointed the branch between the reads above and
            # this push. Refresh and go round again: the max() above picks
            # up its version, so the retry can only ever raise the pending
            # bump, never lower it.
            echo "::notice::$BUMP_BRANCH moved under this run (attempt $attempt/3); re-reading it and recomputing."
            git fetch --force --quiet origin \
              "+refs/heads/$BUMP_BRANCH:refs/remotes/origin/$BUMP_BRANCH"
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::Could not update $BUMP_BRANCH after 3 attempts — another run kept winning the race. Re-run this workflow; it will recompute from whatever the bump PR now holds."
            exit 1
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Open or update the version-bump PR and auto-merge it
        if: steps.label.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          BUMP: ${{ steps.label.outputs.bump }}
          SOURCE_PR: ${{ steps.label.outputs.pr_number }}
        run: |
          set -euo pipefail
          title="chore(release): v$NEXT [release-bump]"

          pr=$(gh pr list --state open --head "$BUMP_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            # A bump PR from an earlier merge is still open and this run has
            # just re-pointed its branch at a higher version. Update it in
            # place rather than opening a second one — two open bump PRs
            # would edit the same version line and neither could auto-merge.
            # Its body keeps the earlier merges' attribution; this run
            # appends its own.
            body=$(gh pr view "$pr" --json body --jq .body)
            gh pr edit "$pr" --title "$title" \
              --body "$body"$'\n'"- re-pointed to v$NEXT by #$SOURCE_PR (\`semver-$BUMP\`)"
          else
            # Read the number back off `gh pr create`'s own output (it
            # prints the new PR's URL) rather than re-listing: a PR that
            # was created a moment ago does not always show up in the
            # next `gh pr list` immediately, and an empty number here
            # would silently skip enabling auto-merge below.
            pr_url=$(gh pr create --base main --head "$BUMP_BRANCH" \
              --title "$title" \
              --body "Automated version bump, opened by \`.github/workflows/release.yml\`. Auto-merges once CI passes; merging cuts the release.

          Every merge to main while this PR is open re-points its branch at a higher version instead of opening a second bump PR, so the release this cuts covers all of them.

          - v$NEXT from #$SOURCE_PR (\`semver-$BUMP\`)" | tail -n1)
            pr="${pr_url##*/}"
            case "$pr" in
              ''|*[!0-9]*)
                pr=$(gh pr list --state open --head "$BUMP_BRANCH" --json number --jq '.[0].number // empty') ;;
            esac
          fi

          if [ -z "$pr" ]; then
            echo "::error::Could not determine the version-bump PR's number, so auto-merge was not enabled on it. Find the open PR from $BUMP_BRANCH and merge it by hand — merging it cuts the v$NEXT release."
            exit 1
          fi

          # Already enabled if this run reused an open PR; asking twice is
          # harmless but pointless, and skipping it keeps the retry loop
          # below meaningful only for the case it exists for.
          if [ -n "$(gh pr view "$pr" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            echo "Auto-merge already enabled on #$pr."
            exit 0
          fi

          # GitHub computes a fresh PR's mergeable status asynchronously,
          # so enabling auto-merge in the same breath as creating it can
          # transiently fail with "Pull request is in unstable status" —
          # retry a few times rather than leaving the PR to merge by hand.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$pr" --auto --squash; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::gh pr merge --auto failed after 5 attempts"
              exit 1
            fi
            sleep 5
          done

  publish-release:
    name: tag, create GitHub Release, attach hllc binary
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-bump]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: release-plz release (tag + GitHub Release, idempotent)
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Attach the hllc binary to the release and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' crates/hl-cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          asset=hllc-linux-x86_64

          # This job has to be safe to run twice for the same version: a
          # manual re-run, a workflow_dispatch repair, or two overlapping
          # bump PRs that collapsed onto one version all get here with the
          # release already made. Tagging is idempotent — `release-plz
          # release` no-ops on an existing tag — but attaching the binary
          # is not: GitHub's immutable-releases feature locks a release's
          # assets the moment it stops being a draft, so `gh release upload
          # --clobber` against an already-published release is rejected.
          # Decide from the release's real state instead of assuming this
          # is the first run.
          if ! release_json=$(gh release view "v$version" --json isDraft,assets 2>/dev/null); then
            echo "::error::No GitHub Release for v$version, and release-plz did not create one — it no-ops when the tag already exists. Delete tag v$version and re-run to recut it, or create the release by hand."
            exit 1
          fi
          is_draft=$(jq -r '.isDraft' <<<"$release_json")
          has_asset=$(jq -r --arg a "$asset" '[.assets[]? | select(.name == $a)] | length' <<<"$release_json")

          if [ "$is_draft" != "true" ]; then
            if [ "$has_asset" -gt 0 ]; then
              echo "::notice::v$version is already published with $asset attached — nothing left to do."
              exit 0
            fi
            echo "::error::v$version is already published but carries no $asset asset, and immutable releases means one cannot be added now. Attach it by hand from a local 'cargo build --release', or delete the release and its tag and re-run this workflow."
            exit 1
          fi

          cp target/release/hllc "$asset"
          gh release upload "v$version" "$asset" --clobber
          # release-plz's own release body comes from each crate's
          # CHANGELOG.md, which this workflow never actually updates
          # (versions are bumped from a PR label, not conventional
          # commits, so there's nothing to regenerate) — it would just
          # keep repeating the placeholder seed entry forever. Real
          # notes come from GitHub's own generate-notes API instead,
          # which summarizes the PRs merged since the last release.
          notes=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="v$version" --jq .body)
          gh release edit "v$version" --draft=false --notes "$notes"
