name: Docs

# Builds the mdBook user guide in book/ and publishes it to GitHub Pages.
# Requires the repository's Settings -> Pages -> Source to be set to
# "GitHub Actions" (one-time manual step; not something a workflow file
# can configure on its own).

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build mdbook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: mdbook build
        run: mdbook build book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: book/book

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
