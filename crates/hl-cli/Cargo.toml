[package]
name = "hl-cli"
version = "0.16.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hllc"
path = "src/main.rs"

[features]
# Off by default: `tests/compose_differential.rs` shells out to
# `docker compose` to have Compose's own parser validate every document
# codegen produces, and Docker is not something a contributor should
# have to install to run `cargo test --workspace`. The feature is the
# opt-in, and it is also the assertion — see that file's own doc for
# why the test fails rather than skips when the feature is on and
# Compose is missing. CI enables it in its own job so the gated code
# cannot rot.
docker-differential = []

[dependencies]
hl-lexer = { path = "../hl-lexer" }
hl-parser = { path = "../hl-parser" }
hl-codegen = { path = "../hl-codegen" }
hl-linker = { path = "../hl-linker" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_yaml_ng = "0.10"
trycmd = "1.2"
