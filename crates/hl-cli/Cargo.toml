[package]
name = "hl-cli"
version = "0.4.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "hllc"
path = "src/main.rs"

[dependencies]
hl-lexer = { path = "../hl-lexer" }
hl-parser = { path = "../hl-parser" }
hl-codegen = { path = "../hl-codegen" }
hl-linker = { path = "../hl-linker" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_yaml = "0.9"
